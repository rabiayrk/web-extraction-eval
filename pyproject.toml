[project]
name = "wxeval"
version = "0.1.0"
description = "Evaluate web data extraction systems on self-hosted synthetic sites"
readme = "README.md"
license = "MIT"
authors = [{ name = "Rabia Yoruk" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "parsel>=1.12",
    "scipy>=1.14",
    "numpy>=2.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.55"]
llm = ["anthropic>=0.70"]
report = ["matplotlib>=3.9"]
tools = [
    "crawl4ai==0.9.5",
    "langchain-anthropic>=1.7.10",
    "scrapegraphai==2.3.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
packages = ["wxeval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
