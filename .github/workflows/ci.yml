name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra browser --extra report
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q
      - name: Smoke run on a small synthetic site, no browser and no LLM
        run: |
          uv run python scripts/run_experiments.py --systems handwritten --fetch http \
            --smoke --results build/ci-results
          uv run python scripts/report.py --results build/ci-results
